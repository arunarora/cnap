replicaCount: 2

image:
  repository: myuser/helm-api  # REPLACE with your image
  pullPolicy: Never
  tag: "1.0.0"

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30763

ingress:
  enabled: true
  className: "kong"
  host: "api.example.com"
  path: "/"
  pathType: Prefix

cnap:
  appName: "simple-api" 
  compName: "api-service"
  protection: "enabled"

