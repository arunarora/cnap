apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # The name is always in the form: <plural>.<group>
  name: applications.cnap.platforms.howlabs.io

spec:
  group: cnap.platforms.howlabs.io
  names:
    kind: Application
    plural: applications
    singular: application
    shortNames:
    - app
    - apps
  # Namespaced or Cluster
  scope: Namespaced
  versions:
  - name: v1alpha1
    # each version can be enabled or disabled for serving with served
    served: true
    # each version can be marked as the storage version with storage
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              # 1. Global Config (Domain, TLS, etc.)
              global:
                type: object
                properties:
                  baseDomain:
                    type: string
                    description: "Base domain for the application (e.g., example.com)"
                  # Used as prefix for all exposed API URLs. For e.g.
                  # For exposed API: example.com/createuser, the URL will be:
                  # For Dev Env:          If envPrefix is "dev"         : dev.example.com/createuser
                  # For Integration Env:  If envPrefix is "integ"       : integ.example.com/createuser
                  # For Staging Env:      If envPrefix is "staging      : staging.example.com/createuser
                  # For Production Env:   No Prefix for Production Env  : example.com/createuser
                  envPrefix:
                    type: array
                    description: "Added as prefix to Base domain to denote env (e.g., dev.example.com for dev environment)"
                    items:
                      type: object
                      properties:
                        env:
                          type: string
                        prefix:
                          type: string
                  authentication:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      methods:
                        type: object
                        properties:
                          basicAuth:
                            type: boolean
                          apiToken:
                              type: boolean
                  singleSignOn:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      methods:
                        type: object
                        properties:                        
                          saml:
                            type: boolean
                          oauth2:
                            type: boolean
                          oidc:
                            type: boolean
              # 2. List of Microservices
              components:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    routes:
                      type: array
                      items:
                        type: object
                        properties:
                          summary:
                            type: string
                            description: "short description of service endpoint"
                          path:
                            type: string
                            description: "URL path, e.g., /api/v1/orders"
                          method:
                            type: string
                            enum: ["GET", "POST", "PUT", "DELETE", "PATCH", "*"]
                          exposedAPI:
                            type: boolean
                            description: "If true, auth is enforced. If false, auth not required."
                          httpsEnabled:
                            type: boolean
                          whitelistIPs:
                            type: array
                            items:
                              type: string
          status:
            type: object
            properties:
              acceptedNames:
                type: object
                properties:
                  plural:
                    type: string
                  singular:
                    type: string
                  kind:
                    type: string
                  listKind:
                    type: string
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
